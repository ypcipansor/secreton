version: '3.8'

services:
  secreton:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secreton-server
    ports:
      - "8080:8080"
      - "8443:8443"
      - "9090:9090"
    environment:
      - RUST_LOG=debug
      - SECRETON_SERVER__HOST=0.0.0.0
      - SECRETON_SERVER__PORT=8080
      - SECRETON_SERVER__LOG_LEVEL=debug
      - SECRETON_SERVER__STORAGE_PATH=/app/data
      - SECRETON_DATABASE__URL=sqlite:/app/data/secreton.db
      - SECRETON_DATABASE__MAX_CONNECTIONS=10
      - SECRETON_AUTH__TOKEN_TTL=3600
      - SECRETON_AUTH__REFRESH_TOKEN_TTL=2592000
      - SECRETON_AUTH__JWT_SECRET=super-secret-jwt-key-change-in-production
      - REDIS_URL=redis://redis:6379
    volumes:
      - secreton_data:/app/data
      - ./logs:/app/logs
    depends_on:
      - redis
      - postgres
    networks:
      - secreton-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: secreton-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - secreton-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  postgres:
    image: postgres:15-alpine
    container_name: secreton-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=secreton
      - POSTGRES_USER=secreton
      - POSTGRES_PASSWORD=secreton-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - secreton-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: secreton-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - secreton
    networks:
      - secreton-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: secreton-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - secreton-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: secreton-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - secreton-network
    restart: unless-stopped

volumes:
  secreton_data:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  secreton-network:
    driver: bridge
