version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Was 25. A queue that large is never reviewed, and unreviewed dependency
    # updates to a secrets manager are worse than slightly stale ones.
    open-pull-requests-limit: 8
    labels: [dependencies, rust]
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
    groups:
      # Grouped so one ecosystem bump is one reviewable pull request rather than
      # a dozen that must be merged in the right order to keep the tree consistent.
      rustcrypto:
        patterns:
          - "aes*"
          - "argon2"
          - "blake3"
          - "chacha20*"
          - "digest"
          - "ed25519*"
          - "hkdf"
          - "hmac"
          - "k256"
          - "p256"
          - "p384"
          - "pbkdf2"
          - "scrypt"
          - "sha2"
          - "sha3"
          - "signature"
          - "subtle"
          - "x25519*"
          - "zeroize*"
      leptos:
        patterns: ["leptos*"]
      axum-tower:
        patterns: ["axum*", "tower*", "hyper*", "http*"]
      tonic:
        patterns: ["tonic*", "prost*"]
      async:
        patterns: ["tokio*", "async-*", "futures*"]
      serde:
        patterns: ["serde*", "toml", "config"]
      storage:
        patterns: ["tokio-postgres*", "deadpool*", "redis"]
      observability:
        patterns: ["tracing*", "metrics*", "opentelemetry*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: "docker"
