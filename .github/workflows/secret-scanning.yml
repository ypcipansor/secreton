name: Secret Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  trivy-secrets:
    name: Trivy Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'sarif'
          output: 'trivy-secrets-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-secrets-results.sarif'
          category: 'trivy-secrets'

  manual-patterns:
    name: Manual Pattern Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          echo "## 🔍 Checking for hardcoded secrets..." >> $GITHUB_STEP_SUMMARY
          
          # Define patterns to search for
          patterns=(
            "password\s*=\s*['\"][^'\"]*['\"]"
            "secret\s*=\s*['\"][^'\"]*['\"]"
            "api[_-]?key\s*=\s*['\"][^'\"]*['\"]"
            "token\s*=\s*['\"][^'\"]*['\"]"
            "AKIA[0-9A-Z]{16}"
            "sk-[a-zA-Z0-9]{48}"
            "xoxb-[0-9]{11,12}-[0-9]{11,12}-[a-zA-Z0-9]{24}"
            "ghp_[a-zA-Z0-9]{36}"
            "gho_[a-zA-Z0-9]{36}"
            "ghu_[a-zA-Z0-9]{36}"
            "ghs_[a-zA-Z0-9]{36}"
            "ghr_[a-zA-Z0-9]{36}"
          )
          
          found=0
          for pattern in "${patterns[@]}"; do
            echo "Checking pattern: $pattern"
            if grep -rEi "$pattern" \
              --include="*.rs" \
              --include="*.toml" \
              --include="*.yaml" \
              --include="*.yml" \
              --include="*.json" \
              --exclude-dir=target \
              --exclude-dir=.git \
              --exclude="Cargo.lock" \
              . | grep -v -E "(example|test|mock|stub|\.env\.example)"; then
              echo "⚠️ Potential secret found matching: $pattern" >> $GITHUB_STEP_SUMMARY
              found=1
            fi
          done
          
          if [ $found -eq 0 ]; then
            echo "✅ No hardcoded secrets detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Potential secrets detected - please review" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  summary:
    name: Secret Scan Summary
    runs-on: ubuntu-latest
    needs: [gitleaks, trufflehog, trivy-secrets, manual-patterns]
    if: always()
    steps:
      - name: Create summary
        run: |
          echo "## 🔐 Secret Scanning Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- Gitleaks: ${{ needs.gitleaks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- TruffleHog: ${{ needs.trufflehog.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy Secrets: ${{ needs.trivy-secrets.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Manual Patterns: ${{ needs.manual-patterns.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.gitleaks.result }}" == "failure" || \
                "${{ needs.trufflehog.result }}" == "failure" || \
                "${{ needs.trivy-secrets.result }}" == "failure" || \
                "${{ needs.manual-patterns.result }}" == "failure" ]]; then
            echo "❌ One or more secret scans detected issues" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ All secret scans passed" >> $GITHUB_STEP_SUMMARY
          fi
