name: Publish

on:
  workflow_dispatch:
    inputs:
      crate:
        description: 'Crate to publish'
        required: true
        type: choice
        options:
          - secreton-crypto
          - secreton-storage
          - secreton-core
          - secreton-api
          - secreton-agent
          - secreton-cli
          - secreton-ui

jobs:
  publish:
    name: Publish ${{ github.event.inputs.crate }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Publish crate
        run: |
          cd crates/${{ github.event.inputs.crate }}
          cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}