name: Deploy to Staging

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build and Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: actions-rs/cargo-cache@v1

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Run security audit
        run: |
          cargo install cargo-audit
          cargo audit

      - name: Build release binary
        run: cargo build --workspace --release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=staging

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Deploy to staging environment
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment commands here
          # For example:
          # kubectl set image deployment/secreton secreton=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          # or
          # docker-compose -f docker-compose.staging.yml up -d

          echo "Deployment completed successfully"

      - name: Run integration tests against staging
        run: |
          echo "Running integration tests against staging..."
          # Add integration test commands here
          # For example:
          # ./scripts/test-staging.sh

          echo "Integration tests passed"

      - name: Notify deployment success
        run: |
          echo "## 🚀 Staging Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Security audit passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Docker image built and pushed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Deployed to staging environment" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Integration tests passed" >> $GITHUB_STEP_SUMMARY
