name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  dependabot-metadata:
    name: Fetch Dependabot Metadata
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    outputs:
      dependency-names: ${{ steps.metadata.outputs.dependency-names }}
      update-type: ${{ steps.metadata.outputs.update-type }}
      dependency-type: ${{ steps.metadata.outputs.dependency-type }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

  dependabot-auto-approve:
    name: Auto-Approve Dependabot PR
    runs-on: ubuntu-latest
    needs: dependabot-metadata
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      (needs.dependabot-metadata.outputs.update-type == 'version-update:semver-patch' ||
       needs.dependabot-metadata.outputs.update-type == 'version-update:semver-minor')
    steps:
      - name: Approve Dependabot PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependabot-auto-merge:
    name: Auto-Merge Dependabot PR
    runs-on: ubuntu-latest
    needs: [dependabot-metadata, dependabot-auto-approve]
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      (needs.dependabot-metadata.outputs.update-type == 'version-update:semver-patch' ||
       needs.dependabot-metadata.outputs.update-type == 'version-update:semver-minor')
    steps:
      - name: Wait for CI checks
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-regexp: '^(Check|Build|Clippy|Test|Format Check|Security Audit|Cargo Deny).*'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          allowed-conclusions: success,skipped,neutral

      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add comment
        run: |
          gh pr comment "$PR_URL" --body "✅ Auto-merge enabled for this ${{ needs.dependabot-metadata.outputs.update-type }} update."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependabot-manual-review:
    name: Manual Review Required
    runs-on: ubuntu-latest
    needs: dependabot-metadata
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      needs.dependabot-metadata.outputs.update-type == 'version-update:semver-major'
    steps:
      - name: Add comment for manual review
        run: |
          gh pr comment "$PR_URL" --body "⚠️ This is a **major version update** and requires manual review before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label PR
        run: |
          gh pr edit "$PR_URL" --add-label "needs-review,major-update"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
