name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build release binaries
        run: |
          cargo build --release --workspace
          mkdir -p release-artifacts
          cp target/release/secreton-agent release-artifacts/ 2>/dev/null || true
          cp target/release/api_server release-artifacts/ 2>/dev/null || true

      - name: Create release archive
        run: |
          cd release-artifacts
          tar -czf ../secreton-${{ github.ref_name }}-linux-x64.tar.gz *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            secreton-${{ github.ref_name }}-linux-x64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}