name: Fuzz Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Sundays
    - cron: '0 2 * * 0'

jobs:
  fuzz:
    name: Fuzz Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run fuzz tests
        run: |
          cd fuzz
          # Run key security-related fuzz targets
          cargo fuzz run api_endpoints -- -max_total_time=300
          cargo fuzz run argon2_operations -- -max_total_time=300
          cargo fuzz run audit_logging -- -max_total_time=300
          cargo fuzz run auth_flows -- -max_total_time=300
          cargo fuzz run encryption_algorithms -- -max_total_time=300
          cargo fuzz run key_generation -- -max_total_time=300
          cargo fuzz run jwt_operations -- -max_total_time=300