name: Code Quality
permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions-rs/cargo-cache@v1

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy with pedantic settings
        run: cargo clippy --workspace --all-targets --all-features -- -W clippy::pedantic -W clippy::nursery -D warnings

      - name: Check for unused dependencies
        run: |
          cargo install cargo-udeps
          cargo udeps --workspace --all-targets --all-features

      - name: Check for security vulnerabilities
        run: |
          cargo install cargo-audit
          cargo audit --deny warnings

      - name: Check licenses
        run: |
          cargo install cargo-deny
          cargo deny check

      - name: Check for outdated dependencies
        run: |
          cargo install cargo-outdated
          cargo outdated --workspace --exit-code 1 || true

      - name: Generate documentation
        run: cargo doc --workspace --no-deps

      - name: Check documentation coverage
        run: |
          cargo install cargo-doc-coverage
          cargo doc-coverage --workspace --threshold 80

      - name: Check for TODO/FIXME comments
        run: |
          if grep -r -i "TODO\|FIXME\|XXX" crates/ tests/; then
            echo "Found TODO/FIXME comments. Please address them before merging."
            exit 1
          fi

      - name: Check for large files
        run: |
          find . -type f -size +50M | while read -r file; do
            echo "Large file found: $file"
            exit 1
          done

      - name: Check for secrets in code
        run: |
          if grep -r -i "password\|secret\|key\|token" --include="*.rs" --include="*.toml" crates/ | grep -v "example\|test\|mock\|stub"; then
            echo "Potential secrets found in code. Please use environment variables or secure storage."
            exit 1
          fi
