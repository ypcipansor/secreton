name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
            revert
          requireScope: false
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            doesn't match the configured pattern. Please ensure that the subject
            starts with an uppercase character.

      - name: Check PR size
        id: pr_size
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          CHANGED_FILES=$(gh pr view $PR_NUMBER --json files --jq '.files | length')
          ADDITIONS=$(gh pr view $PR_NUMBER --json additions --jq '.additions')
          DELETIONS=$(gh pr view $PR_NUMBER --json deletions --jq '.deletions')
          TOTAL_CHANGES=$((ADDITIONS + DELETIONS))
          
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
          echo "deletions=$DELETIONS" >> $GITHUB_OUTPUT
          echo "total_changes=$TOTAL_CHANGES" >> $GITHUB_OUTPUT
          
          echo "## 📊 PR Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- Files changed: $CHANGED_FILES" >> $GITHUB_STEP_SUMMARY
          echo "- Lines added: $ADDITIONS" >> $GITHUB_STEP_SUMMARY
          echo "- Lines deleted: $DELETIONS" >> $GITHUB_STEP_SUMMARY
          echo "- Total changes: $TOTAL_CHANGES" >> $GITHUB_STEP_SUMMARY
          
          if [ $TOTAL_CHANGES -gt 1000 ]; then
            echo "⚠️ Large PR detected (>1000 lines changed)" >> $GITHUB_STEP_SUMMARY
            echo "size=xl" >> $GITHUB_OUTPUT
          elif [ $TOTAL_CHANGES -gt 500 ]; then
            echo "⚠️ Medium-large PR (>500 lines changed)" >> $GITHUB_STEP_SUMMARY
            echo "size=large" >> $GITHUB_OUTPUT
          elif [ $TOTAL_CHANGES -gt 100 ]; then
            echo "✅ Medium PR" >> $GITHUB_STEP_SUMMARY
            echo "size=medium" >> $GITHUB_OUTPUT
          else
            echo "✅ Small PR" >> $GITHUB_STEP_SUMMARY
            echo "size=small" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label PR by size
        run: |
          # `gh pr edit --add-label` fails outright when the label does not exist in the
          # repository — it does not create one. None of these had ever been created, so
          # this step failed with "'size:xl' not found" on every pull request the
          # workflow had ever run against. Create them first; `gh label create` exits
          # non-zero when the label already exists, which is the normal case.
          gh label create "size:small"  --color 0e8a16 --description "Under 100 lines changed"  || true
          gh label create "size:medium" --color fbca04 --description "100-500 lines changed"    || true
          gh label create "size:large"  --color d93f0b --description "500-1000 lines changed"   || true
          gh label create "size:xl"     --color b60205 --description "Over 1000 lines changed"  || true

          gh pr edit ${{ github.event.pull_request.number }} \
            --remove-label "size:small,size:medium,size:large,size:xl" || true
          gh pr edit ${{ github.event.pull_request.number }} \
            --add-label "size:${{ steps.pr_size.outputs.size }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for breaking changes
        id: breaking_changes
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          if echo "$PR_BODY" | grep -qi "BREAKING CHANGE"; then
            echo "has_breaking_changes=true" >> $GITHUB_OUTPUT
            echo "⚠️ Breaking changes detected in PR description" >> $GITHUB_STEP_SUMMARY
          else
            echo "has_breaking_changes=false" >> $GITHUB_OUTPUT
            echo "✅ No breaking changes declared" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Label breaking changes
        if: steps.breaking_changes.outputs.has_breaking_changes == 'true'
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --add-label "breaking-change"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changelog update
        id: changelog
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "CHANGELOG.md"; then
            echo "changelog_updated=true" >> $GITHUB_OUTPUT
            echo "✅ Changelog updated" >> $GITHUB_STEP_SUMMARY
          else
            echo "changelog_updated=false" >> $GITHUB_OUTPUT
            echo "⚠️ Changelog not updated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Add PR comment with validation results
        uses: actions/github-script@v8
        with:
          script: |
            const prSize = '${{ steps.pr_size.outputs.size }}';
            const totalChanges = '${{ steps.pr_size.outputs.total_changes }}';
            const hasBreakingChanges = '${{ steps.breaking_changes.outputs.has_breaking_changes }}' === 'true';
            const changelogUpdated = '${{ steps.changelog.outputs.changelog_updated }}' === 'true';
            
            let comment = '## 🤖 PR Validation Report\n\n';
            comment += '### Size Analysis\n';
            comment += `- **Size**: \`${prSize}\`\n`;
            comment += `- **Total Changes**: ${totalChanges} lines\n\n`;
            
            if (prSize === 'xl' || prSize === 'large') {
              comment += '⚠️ **Large PR detected.** Consider breaking it into smaller PRs for easier review.\n\n';
            }
            
            comment += '### Breaking Changes\n';
            if (hasBreakingChanges) {
              comment += '⚠️ **This PR contains breaking changes.** Please ensure:\n';
              comment += '- Migration guide is included\n';
              comment += '- Version bump is appropriate (major version)\n';
              comment += '- Documentation is updated\n\n';
            } else {
              comment += '✅ No breaking changes declared\n\n';
            }
            
            comment += '### Changelog\n';
            if (!changelogUpdated && prSize !== 'small') {
              comment += '⚠️ **Changelog not updated.** Consider adding an entry for this change.\n\n';
            } else if (changelogUpdated) {
              comment += '✅ Changelog updated\n\n';
            }
            
            comment += '---\n';
            comment += '*This comment was automatically generated by the PR validation workflow.*';
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
