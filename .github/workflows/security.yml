name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories are published continuously; a nightly run catches one that lands
    # between pull requests.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      # Prebuilt binary. Compiling cargo-audit from source took minutes per run.
      - uses: taiki-e/install-action@cargo-audit
      # No `--locked`: cargo-audit does not accept it (it reads the committed
      # Cargo.lock directly). Passing it failed the job with "unexpected argument".
      - run: cargo audit --deny warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Separate jobs so a licence problem is not hidden behind an advisory.
        check: [advisories, bans, licenses, sources]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The action bundles its own cargo-deny, and v2.0.11's is too old to parse the
      # CVSS 4.0 advisories now in the database — it aborts with "unsupported CVSS
      # version: 4.0" before checking anything. Installing the binary directly keeps
      # the version visible here rather than buried in an action release.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check ${{ matrix.check }}

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks lists the pull request's commits to scan only what changed. Without
      # this the call returns 403 "Resource not accessible by integration" and the
      # job dies on an unhandled rejection.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Pinned to a release SHA. These previously tracked @master and @main, which
      # means an upstream compromise executes in a workflow holding this repo's token.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulnerabilities:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 0.30.0 referenced `aquasecurity/setup-trivy@v0.2.2`, a tag that has since been
      # removed, so the job failed at "Unable to resolve action" before scanning.
      #
      # Results go to the log and set the exit code; they are not uploaded as SARIF.
      # Two reasons, and the second is the important one:
      #
      #  1. This repository is private, and pushing SARIF to code scanning on a private
      #     repository requires GitHub Advanced Security. Without it the upload returns
      #     403 "Resource not accessible by integration" and fails the job. The job
      #     already granted `security-events: write`, so no permission change fixes it —
      #     the blocker is the plan, not the token.
      #  2. The SARIF shape gated nothing. `format: sarif` makes trivy exit 0 whatever it
      #     finds, and the upload step ran `if: always()`, so a CRITICAL finding would
      #     have gone to a dashboard and left CI green. `exit-code: 1` is what makes this
      #     a check rather than a report.
      #
      # If Advanced Security is ever enabled here, add the upload back alongside this —
      # not instead of it.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
