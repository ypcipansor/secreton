name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly security scans
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: actions-rs/cargo-cache@v1

      - name: Install security tools
        run: |
          cargo install cargo-audit
          cargo install cargo-deny
          cargo install cargo-geiger

      - name: Run cargo audit
        run: cargo audit --deny warnings

      - name: Run cargo deny security check
        run: cargo deny check advisories

      - name: Run cargo-geiger (unsafe code analysis)
        run: cargo geiger --output-format json | tee geiger-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            geiger-report.json

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Gosec for Go dependencies (if any)
        run: |
          if find . -name "*.go" -type f | grep -q .; then
            go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
            gosec ./...
          else
            echo "No Go files found, skipping Gosec scan"
          fi

      - name: Check for hardcoded secrets
        run: |
          # Check for common patterns
          patterns=(
            "password.*="
            "secret.*="
            "key.*="
            "token.*="
            "AKIA[0-9A-Z]{16}"
            "sk-[a-zA-Z0-9]{48}"
            "xoxb-[0-9]{12}-[0-9]{12}-[a-zA-Z0-9]{24}"
          )

          for pattern in "${patterns[@]}"; do
            if grep -r -i "$pattern" --include="*.rs" --include="*.toml" --include="*.yaml" --include="*.yml" . | grep -v -E "(target/|\.git/|Cargo\.lock|example|test|mock|stub)"; then
              echo "Potential hardcoded secret found matching pattern: $pattern"
              exit 1
            fi
          done

      - name: Check for vulnerable dependencies in package files
        run: |
          # Check for known vulnerable versions in Cargo.toml files
          if grep -r "ring.*0\.16" crates/ 2>/dev/null; then
            echo "Found vulnerable ring version 0.16"
            exit 1
          fi

      - name: Security audit summary
        run: |
          echo "## Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cargo audit completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ License check completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Unsafe code analysis completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Vulnerability scan completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Secrets scan completed" >> $GITHUB_STEP_SUMMARY
