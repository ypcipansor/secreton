name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories are published continuously; a nightly run catches one that lands
    # between pull requests.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      # Prebuilt binary. Compiling cargo-audit from source took minutes per run.
      - uses: taiki-e/install-action@cargo-audit
      # No `--locked`: cargo-audit does not accept it (it reads the committed
      # Cargo.lock directly). Passing it failed the job with "unexpected argument".
      - run: cargo audit --deny warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Separate jobs so a licence problem is not hidden behind an advisory.
        check: [advisories, bans, licenses, sources]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The action bundles its own cargo-deny, and v2.0.11's is too old to parse the
      # CVSS 4.0 advisories now in the database — it aborts with "unsupported CVSS
      # version: 4.0" before checking anything. Installing the binary directly keeps
      # the version visible here rather than buried in an action release.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check ${{ matrix.check }}

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The scan walks a commit range, so the range's far end has to be present.
          fetch-depth: 0
      # gitleaks-action left this job red on every run, on this branch and on `main`
      # alike: since v2 it refuses to scan a repository owned by an organization
      # without a GITLEAKS_LICENSE issued by gitleaks.io, and this repository belongs
      # to one. It exited before reading a single line of the tree. The scanner itself
      # is MIT-licensed and needs no key — the key gates the wrapper action only — so
      # the released binary is run directly here.
      #
      # Pinned by version and verified by sha256. The action was pinned to a release
      # SHA for the same reason: an upstream compromise must not execute in a
      # workflow holding this repository's token, and a checksum cannot be rewritten
      # under a tag the way a release asset can.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          "$HOME/.local/bin/gitleaks" version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # A pull request or a push is judged on the commits it adds. Walking the whole
      # history instead would re-report the fabricated keys in docs and fixtures that
      # this repository's history carries, which reach nothing now and which nobody can
      # rotate. `--no-merges` keeps the synthetic `refs/pull/<n>/merge` commit that
      # checkout leaves HEAD on out of the scan, so a finding is reported once, not twice.
      #
      # The event payload reaches the shell through the environment, never through
      # `${{ }}` interpolation: `github.event.before` is repository-controlled for
      # pushes, but interpolating a payload value into a script is the injection the
      # PR-validation workflow already had to fix.
      - name: Scan commits under test
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            range="origin/${BASE_REF}..HEAD"
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            range="${BEFORE}..${AFTER}"
          else
            # A branch's first push reports an all-zero `before`: no parent to diff.
            range="-1"
          fi
          gitleaks git --no-banner --redact --exit-code 1 \
            --log-opts="--no-merges ${range}"

      # The nightly run exists to catch a secret that landed without a pull request.
      # There is no commit range to judge it against, so it reads the tree as it stands
      # — which is also the only thing a reader can still act on. Acknowledged
      # false positives live in `.gitleaksignore`.
      - name: Scan the tree
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: gitleaks dir . --no-banner --redact --exit-code 1

  vulnerabilities:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # 0.30.0 referenced `aquasecurity/setup-trivy@v0.2.2`, a tag that has since been
      # removed, so the job failed at "Unable to resolve action" before scanning.
      #
      # Results go to the log and set the exit code; they are not uploaded as SARIF.
      # Two reasons, and the second is the important one:
      #
      #  1. This repository is private, and pushing SARIF to code scanning on a private
      #     repository requires GitHub Advanced Security. Without it the upload returns
      #     403 "Resource not accessible by integration" and fails the job. The job
      #     already granted `security-events: write`, so no permission change fixes it —
      #     the blocker is the plan, not the token.
      #  2. The SARIF shape gated nothing. `format: sarif` makes trivy exit 0 whatever it
      #     finds, and the upload step ran `if: always()`, so a CRITICAL finding would
      #     have gone to a dashboard and left CI green. `exit-code: 1` is what makes this
      #     a check rather than a report.
      #
      # If Advanced Security is ever enabled here, add the upload back alongside this —
      # not instead of it.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
