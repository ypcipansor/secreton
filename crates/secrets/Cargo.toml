[package]
name = "secreton-secrets"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Secret engines and backends for Secreton vault system"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
# Core dependencies
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
tokio.workspace = true
futures.workspace = true

# Shared crates
secreton-common.workspace = true
secreton-errors.workspace = true
secreton-config.workspace = true
secreton-crypto.workspace = true
secreton-storage.workspace = true

# AWS SDK
aws-config.workspace = true
aws-sdk-sts.workspace = true

# Crypto dependencies
aes-gcm.workspace = true
chacha20poly1305.workspace = true
rand.workspace = true
base64.workspace = true
generic-array.workspace = true
hmac.workspace = true
sha1.workspace = true
base32.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true

# Certificate generation dependencies
rcgen.workspace = true
x509-cert.workspace = true
pem.workspace = true

# Database dependencies
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
mysql_async = { workspace = true, optional = true }
mongodb = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
ldap3 = "0.11"

[features]
default = ["postgres", "mysql", "mongodb", "redis"]
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres"]
mysql = ["dep:mysql_async"]
mongodb = ["dep:mongodb"]
redis = ["dep:redis"]