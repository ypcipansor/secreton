[package]
name = "secreton-secrets-database"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Database secret engines for Secreton"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
# Core dependencies
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
tokio.workspace = true
futures.workspace = true

# Shared crates
secreton-common.workspace = true
secreton-errors.workspace = true
secreton-config.workspace = true
secreton-crypto.workspace = true
secreton-storage.workspace = true

# Database dependencies
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
mysql_async = { workspace = true, optional = true }
redis = { workspace = true, features = ["aio", "tokio-comp"], optional = true }

# Random number generation
rand.workspace = true

[features]
default = ["postgres", "mysql"]
postgres = ["tokio-postgres", "deadpool-postgres"]
mysql = ["mysql_async"]
redis = ["dep:redis"]
