[package]
name = "secreton-auth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Authentication methods and login flows for Secreton system"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
# Core dependencies
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
tokio.workspace = true
futures.workspace = true
regex.workspace = true

# Shared crates
secreton-common.workspace = true
secreton-errors.workspace = true
secreton-config.workspace = true
secreton-crypto.workspace = true

# HTTP client for OAuth/OIDC
reqwest = { workspace = true, features = ["json", "rustls-tls"] }

# URL encoding
urlencoding.workspace = true

# LDAP support
ldap3 = { workspace = true, optional = true }

# JWT support for OIDC/OAuth
jsonwebtoken.workspace = true

# Password hashing for userpass
argon2.workspace = true
password-hash.workspace = true

# OAuth2 support
oauth2 = { workspace = true, optional = true }

# Kubernetes support
k8s-openapi = { workspace = true, optional = true }
kube = { workspace = true, optional = true }

# AWS support
aws-config = { workspace = true, optional = true }
aws-sdk-sts = { workspace = true, optional = true }
aws-sdk-iam = { workspace = true, optional = true }

# SAML XML parsing
xml = { workspace = true, optional = true }

# Compression for SAML
flate2.workspace = true

# RADIUS support
radius-rust = { workspace = true, optional = true }

# X.509 certificate parsing
x509-parser.workspace = true

# MD5 for RADIUS
md5.workspace = true

# Base64 encoding
base64.workspace = true

# Random number generation
rand.workspace = true

# Hex encoding
hex.workspace = true

# Base32 encoding for TOTP
base32.workspace = true

# HMAC and SHA for MFA
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true

# Policy evaluation
pest.workspace = true
pest_derive.workspace = true

[features]
default = ["ldap", "oidc", "oauth2", "saml"]
ldap = ["dep:ldap3"]
radius = ["dep:radius-rust"]
oidc = ["dep:oauth2"]
oauth2 = ["dep:oauth2"]
saml = ["dep:xml"]
kubernetes = ["dep:k8s-openapi", "dep:kube"]
aws = ["dep:aws-config", "dep:aws-sdk-sts", "dep:aws-sdk-iam"]
