[package]
name = "secret_versioning"
version = "0.1.0"
edition = "2021"
authors = ["Cipherce Security Team <security@cipherce.io>"]
description = "Secret Versioning & Audit Trail for Secreton - Maximum Security, Zero Trust, Forever Secret"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
audit_log = { path = "../audit_log" }
uuid = { version = "1.8", features = ["v4"] }
