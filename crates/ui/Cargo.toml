[package]
name = "secreton-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Web UI for Secreton system"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true


[dependencies]
secreton-core.workspace = true
secreton-crypto.workspace = true
secreton-auth.workspace = true
serde.workspace = true
anyhow.workspace = true
serde_json.workspace = true

# Authentication dependencies
argon2.workspace = true
zeroize.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true

# Server-side web framework
axum.workspace = true

# Client-side (optional) dependencies for Leptos UI (wasm)
leptos = { workspace = true, optional = true }
leptos_router = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

# HTTP client and asset embedding for client build (optional)
reqwest = { workspace = true, optional = true }
rust-embed = { workspace = true }  # Required for static asset serving
mime_guess.workspace = true

# CLI tools
clap = { workspace = true, optional = true }
rpassword = { workspace = true, optional = true }

[features]
client = ["leptos", "leptos_router", "web-sys", "wasm-bindgen-futures", "reqwest"]
cli = ["clap", "rpassword"]

[[bin]]
name = "secreton-user"
path = "src/bin/user_manager.rs"
required-features = ["cli"]
