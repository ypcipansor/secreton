[package]
name = "secreton-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
leptos_meta = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
gloo-net = "0.5"
gloo-storage = "0.3"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
uuid = { version = "1.0", features = ["serde", "v4", "js"] }
thiserror = "1.0"
log = "0.4"
wasm-logger = "0.2"
leptos_icons = "0.3"
icondata = "0.3"
web-sys = { workspace = true, features = ["Window", "Navigator", "Clipboard"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Profile for smaller binary size
[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'
panic = "abort"
strip = true
