[build]
target = "index.html"
dist = "dist"

[serve]
address = "127.0.0.1"
port = 8081
open = false
ws_protocol = "ws"

# Proxy configuration for Database/PKI/Transit/SSH/TOTP endpoints served by Axum
# Note: The backend port 8090 assumes the API server is running on default port 8080 (offset +10).
# If the API server port is changed, this must be updated manually.
[[proxy]]
rewrite = "/api/v1/database/"
backend = "http://127.0.0.1:8090/api/v1/database/"

[[proxy]]
rewrite = "/api/v1/pki/"
backend = "http://127.0.0.1:8090/api/v1/pki/"

[[proxy]]
rewrite = "/api/v1/transit/"
backend = "http://127.0.0.1:8090/api/v1/transit/"

[[proxy]]
rewrite = "/api/v1/ssh/"
backend = "http://127.0.0.1:8090/api/v1/ssh/"

[[proxy]]
rewrite = "/api/v1/totp/"
backend = "http://127.0.0.1:8090/api/v1/totp/"

[[proxy]]
rewrite = "/api/v1/secret/"
backend = "http://127.0.0.1:8090/api/v1/secret/"

[[proxy]]
rewrite = "/api/v1/"
backend = "http://127.0.0.1:8080/api/v1/"

[[proxy]]
rewrite = "/health"
backend = "http://127.0.0.1:8080/health"
