[package]
name = "secreton-crypto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cryptographic primitives and quantum-safe algorithms for Secreton using Ed25519 for signatures"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
# Core dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true

# Cryptographic dependencies - RustCrypto suite
ring.workspace = true
aes.workspace = true
aes-gcm.workspace = true
chacha20poly1305.workspace = true
cbc = "0.1"
argon2.workspace = true
sha2.workspace = true
sha3.workspace = true
blake3.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
hkdf.workspace = true
scrypt.workspace = true
hex.workspace = true
base64.workspace = true
rand.workspace = true
regex.workspace = true

# Elliptic curve cryptography
p256.workspace = true
p384.workspace = true
k256.workspace = true
x25519-dalek.workspace = true
ed25519-dalek.workspace = true
signature = "2.2"

# Workspace dependencies
# secreton-storage.workspace = true  # TODO: Resolve cyclic dependency
generic-array.workspace = true
subtle.workspace = true
zeroize.workspace = true

# Post-Quantum Cryptography
pqcrypto-mldsa = "0.1.2"
pqcrypto-mlkem = "0.1.1"
pqcrypto-falcon = "0.4.1"
pqcrypto-traits = "0.3"

# Homomorphic Encryption
# kzen-paillier = "0.4.3"  # Removed due to curve25519-dalek vulnerability
bgv = "0.6.0"
ckks-engine = "4.0.0"

# Shamir Secret Sharing
num-bigint = { version = "0.4", features = ["rand", "serde"] }
num-integer = "0.1"
num-traits = "0.2"

# Async utilities
async-trait.workspace = true
num_cpus = "1.16"

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
