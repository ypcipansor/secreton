[package]
name = "secreton-integrations"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "External integrations and third-party service connectors for Secreton"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
# Core dependencies
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
tokio.workspace = true
secreton-common.workspace = true

# HTTP client
reqwest.workspace = true

# Cloud provider SDKs
aws-config.workspace = true
aws-sdk-iam.workspace = true
aws-sdk-sts.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-secretsmanager.workspace = true

# Kubernetes (optional)
#[cfg(feature = "kubernetes")]
#kube.workspace = true

# CI/CD integrations
oauth2.workspace = true

# Additional dependencies for integrations
libloading.workspace = true
base64.workspace = true
md5.workspace = true

# Database support
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
redis = { workspace = true, features = ["aio", "tokio-comp"], optional = true }
mysql_async.workspace = true
mongodb.workspace = true

# Random number generation
rand.workspace = true

[features]
default = []
postgres = ["tokio-postgres", "deadpool-postgres"]
redis = ["dep:redis"]
kubernetes = []
aws = []
azure = []
gcp = []