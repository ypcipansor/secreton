[package]
name = "secreton-integrations"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "External integrations and third-party service connectors for Secreton"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
# Core dependencies
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
tokio.workspace = true
secreton-common.workspace = true
once_cell.workspace = true

# HTTP client for webhooks and RabbitMQ management API
reqwest = { workspace = true, features = ["json", "rustls-tls"] }

# Cloud provider SDKs
aws-config.workspace = true
aws-sdk-iam.workspace = true
aws-sdk-sts.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-secretsmanager.workspace = true

# GCP SDK
# gcp_auth = "0.8"
# google-cloud-token = "0.1"

# Azure SDK (simplified)
# oauth2 = "4.0"

# Kubernetes (optional)
#[cfg(feature = "kubernetes")]
#kube.workspace = true

# Additional dependencies for integrations
libloading.workspace = true
base64.workspace = true
md5.workspace = true
rand.workspace = true
urlencoding.workspace = true
mongodb.workspace = true
secreton-errors.workspace = true

# LDAP support
ldap3 = { version = "0.12.1", optional = true }

# Hashing for RabbitMQ password
sha2.workspace = true

# Database support
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
redis = { workspace = true, features = ["aio", "tokio-comp"], optional = true }
mysql_async.workspace = true

# Certificate generation
rcgen.workspace = true
yasna.workspace = true

[features]
default = []
postgres = ["tokio-postgres", "deadpool-postgres"]
redis = ["dep:redis"]
kubernetes = []
aws = []
azure = []
gcp = []
ldap = ["dep:ldap3"]
rabbitmq = []