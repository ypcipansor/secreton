[package]
name = "secreton-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "RESTful and gRPC API server for Secreton vault system"
keywords = ["api", "rest", "grpc", "http", "server"]

[dependencies]
# Core dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
futures.workspace = true

# HTTP server
axum.workspace = true
hyper.workspace = true
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "compression-full", "fs"] }
http-body-util = "0.1"

# Authentication
jsonwebtoken = "9.3"

# Utility crates
base64.workspace = true
hex.workspace = true

# Authentication and authorization
oauth2 = "4.4"

# Rate limiting and security
governor = "0.6"
headers = "0.4"

# OpenAPI documentation - Updated to latest versions for security
utoipa = { version = "5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8.0", features = ["axum"] }

# Storage
secreton-storage = { path = "../storage" }

# Metrics
prometheus.workspace = true

# TLS
rustls.workspace = true
rustls-webpki.workspace = true
rustls-pemfile = "2.1"
tokio-rustls = "0.26"
axum-server = { version = "0.6", features = ["tls-rustls"] }
x509-parser = "0.16"

[dev-dependencies]
criterion.workspace = true
wiremock = { workspace = true }
mockito = "1.4"

[build-dependencies]
tonic-build = "0.10"
