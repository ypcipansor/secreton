[package]
name = "brankas-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "RESTful and gRPC API server for Brankas vault system"
keywords = ["api", "rest", "grpc", "http", "server"]

[dependencies]
# Core dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
futures.workspace = true

# HTTP server
axum.workspace = true
hyper.workspace = true
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "compression-full", "fs"] }

# Authentication
jsonwebtoken = "9.3"

# Utility crates
base64.workspace = true
hex.workspace = true

# Internal dependencies
brankas-crypto = { path = "../crypto" }
brankas-core = { path = "../core" }
prost.workspace = true

# TLS
rustls.workspace = true
rustls-webpki.workspace = true

# Authentication and authorization
oauth2 = "4.4"

# Rate limiting and security
governor = "0.6"
headers = "0.4"

# OpenAPI documentation
utoipa = { version = "4.2", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }

# Storage
brankas-storage = { path = "../storage" }

# Metrics
prometheus.workspace = true

[dev-dependencies]
criterion.workspace = true
wiremock.workspace = true

[build-dependencies]
tonic-build = "0.10"
