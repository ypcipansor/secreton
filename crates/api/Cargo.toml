[package]
name = "secreton-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "RESTful and gRPC API server for Secreton system"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
# Core dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
num_cpus = "1.0"
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
futures.workspace = true

# HTTP frameworks
warp = { workspace = true, features = ["server"] }
hyper.workspace = true
tower = { workspace = true, features = ["make"] }
tower-http = { workspace = true, features = ["cors", "trace", "timeout", "compression-full", "fs"] }
http-body-util.workspace = true
axum = { workspace = true, features = ["macros", "multipart", "json", "tracing"] }

# Authentication
# jwt-simple = "0.12"  # Removed due to rsa dependency
hmac.workspace = true
sha2.workspace = true
sha1.workspace = true
oauth2 = "4.4"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
sha3.workspace = true
jsonwebtoken.workspace = true

# Utility crates
base64.workspace = true
hex.workspace = true
lru.workspace = true
lazy_static.workspace = true
bincode.workspace = true

# Rate limiting and security
governor.workspace = true
headers.workspace = true

# OpenAPI documentation - Updated to latest versions for security
utoipa.workspace = true
utoipa-swagger-ui.workspace = true

tonic = { workspace = true, features = ["transport", "codegen"] }

# Internal crates
secreton-monitoring = { path = "../monitoring" }
secreton-storage = { path = "../storage" }
secreton-crypto = { path = "../crypto" }
secreton-errors = { path = "../errors" }
secreton-security = { path = "../security", features = ["wasmi"] }
secreton-common = { path = "../common" }
# secreton-token = { path = "../token" }  # JWT functionality moved to auth crate
secreton-auth = { path = "../auth" }
secreton-config = { path = "../config" }
secreton-performance = { path = "../performance" }
secreton-grpc = { path = "../grpc" }
secreton-secrets = { path = "../secrets" }

# Metrics
prometheus.workspace = true

# Random number generation
rand.workspace = true

# Container orchestration
bollard.workspace = true
# kube = { version = "0.88", features = ["client", "rustls-tls"] }  # Temporarily disabled due to k8s-openapi compatibility

# TLS
rustls.workspace = true
rustls-webpki.workspace = true
rustls-pemfile.workspace = true
tokio-rustls.workspace = true
# axum-server.workspace = true  # Temporarily disabled due to hyper 1.x compatibility issues
x509-parser.workspace = true

[dev-dependencies]
criterion.workspace = true
wiremock.workspace = true
mockito.workspace = true
axum-test = "18.0.0"
# k8s-openapi = { version = "0.26", features = ["v1_30"] }  # Temporarily disabled due to kube compatibility

[build-dependencies]
tonic-build.workspace = true
