[package]
name = "secreton-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "RESTful and gRPC API server for Secreton vault system"
keywords = ["api", "rest", "grpc", "http", "server"]

[dependencies]
# Core dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
futures.workspace = true

# HTTP server
axum.workspace = true
hyper.workspace = true
tower = { version = "0.4", features = ["make"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "compression-full", "fs"] }
http-body-util = "0.1"

# Authentication
jsonwebtoken = { version = "10.0", features = ["rust_crypto"] }

# Utility crates
base64.workspace = true
hex.workspace = true

# Authentication and authorization
oauth2 = "5.0"

# Rate limiting and security
governor = "0.6"
headers = "0.4"

# OpenAPI documentation - Updated to latest versions for security
utoipa = { version = "5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8.0", features = ["axum"] }

# Internal crates
secreton-core = { path = "../core" }
secreton-storage = { path = "../storage" }
secreton-crypto = { path = "../crypto" }

# Metrics
prometheus.workspace = true

# Random number generation
rand = "0.8"

# Container orchestration
bollard = "0.16"
kube = { version = "0.88", features = ["client", "rustls-tls"] }

# TLS
rustls.workspace = true
rustls-webpki.workspace = true
rustls-pemfile = "2.1"
tokio-rustls = "0.26"
axum-server = { version = "0.6", features = ["tls-rustls"] }
x509-parser = "0.16"

[dev-dependencies]
criterion.workspace = true
wiremock = { workspace = true }
mockito = "1.4"
k8s-openapi = { version = "0.21", features = ["v1_29"] }

[build-dependencies]
tonic-build = "0.10"
