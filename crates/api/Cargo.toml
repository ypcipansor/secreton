[package]
name = "secreton-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "RESTful and gRPC API server for Secreton system"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
# Core dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
futures.workspace = true

# HTTP server
axum.workspace = true
hyper.workspace = true
tower = { version = "0.4", features = ["make"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "compression-full", "fs"] }
http-body-util = "0.1"

# Authentication
# jwt-simple = "0.12"  # Removed due to rsa dependency
hmac.workspace = true
sha1 = "0.10"
sha2.workspace = true

# Utility crates
base64.workspace = true
hex.workspace = true

# Authentication and authorization
oauth2 = "5.0"

# Rate limiting and security
governor = "0.6"
headers = "0.4"

# OpenAPI documentation - Updated to latest versions for security
utoipa = { version = "5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8.0", features = ["axum"] }

# Internal crates
secreton-core = { path = "../core" }
secreton-storage = { path = "../storage" }
secreton-crypto = { path = "../crypto" }

# Metrics
prometheus.workspace = true

# Random number generation
rand = "0.8"

# Container orchestration
bollard = "0.16"
# kube = { version = "0.88", features = ["client", "rustls-tls"] }  # Temporarily disabled due to k8s-openapi compatibility

# TLS
rustls.workspace = true
rustls-webpki.workspace = true
rustls-pemfile = "2.1"
tokio-rustls = "0.26"
axum-server = { version = "0.7", features = ["tls-rustls"] }
x509-parser = "0.16"

[dev-dependencies]
criterion.workspace = true
wiremock = { workspace = true }
mockito = "1.4"
# k8s-openapi = { version = "0.26", features = ["v1_30"] }  # Temporarily disabled due to kube compatibility

[build-dependencies]
tonic-build = "0.10"
