[package]
name = "secreton-auth-methods"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Authentication methods and login flows for Secreton system"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
# Core dependencies
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
tokio.workspace = true
futures.workspace = true
regex.workspace = true

# Shared crates
secreton-common.workspace = true
secreton-errors.workspace = true
secreton-config.workspace = true
secreton-crypto.workspace = true

# HTTP client for OAuth/OIDC
reqwest = { workspace = true, features = ["json", "rustls-tls"] }

# LDAP support
ldap3 = { version = "0.11", optional = true }

# JWT support for OIDC/OAuth
jsonwebtoken.workspace = true

# Password hashing for userpass
argon2 = { version = "0.5", features = ["std"] }
password-hash = "0.5"

# OAuth2 support
oauth2 = { version = "4.4", optional = true }

# Kubernetes support
k8s-openapi = { version = "0.21", optional = true }
kube = { version = "0.88", optional = true }

# AWS support
aws-config = { version = "1.0", optional = true }
aws-sdk-sts = { version = "1.3", optional = true }
aws-sdk-iam = { version = "1.3", optional = true }

# SAML XML parsing
xml = { version = "0.8", optional = true }

# Compression for SAML
flate2 = "1.0"

# RADIUS support
radius-rust = { version = "0.4.4", optional = true }

# X.509 certificate parsing
x509-parser = "0.15"

# MD5 for RADIUS
md5 = "0.7"

# Base64 encoding
base64.workspace = true

# Random number generation
rand.workspace = true

# Hex encoding
hex.workspace = true

# Base32 encoding for TOTP
base32.workspace = true

# HMAC and SHA1 for TOTP
hmac.workspace = true
sha1.workspace = true

[features]
default = ["ldap", "oidc", "oauth2", "saml"]
ldap = ["dep:ldap3"]
radius = ["dep:radius-rust"]
oidc = ["dep:oauth2"]
oauth2 = ["dep:oauth2"]
saml = ["dep:xml"]
kubernetes = ["dep:k8s-openapi", "dep:kube"]
aws = ["dep:aws-config", "dep:aws-sdk-sts", "dep:aws-sdk-iam"]
