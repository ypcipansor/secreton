[package]
name = "secreton-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core types and utilities for Secreton vault system"
keywords = ["core", "types", "utilities", "security"]

[dependencies]
# Core dependencies
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
config.workspace = true

# API Documentation
aide.workspace = true

# Async
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true

# Storage
secreton-storage.workspace = true

tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
# Using tokio-postgres-rustls for pure Rust TLS (no OpenSSL)\ntokio-postgres-rustls = { workspace = true, optional = true }
mysql_async.workspace = true
mongodb.workspace = true
redis = { workspace = true, features = ["aio", "tokio-comp"] }
# SQLx temporarily disabled due to RSA vulnerability in MySQL backend
# sqlx = { version = "0.8.2", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"], optional = true }

# AWS SDK
aws-config = { workspace = true }
aws-sdk-iam = { workspace = true }
aws-sdk-sts = { workspace = true }

# Threading and concurrency
parking_lot.workspace = true
once_cell.workspace = true

# Security dependencies for advanced features
rand.workspace = true
aes-gcm.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
sha1.workspace = true
data-encoding.workspace = true
base64.workspace = true
hex.workspace = true
urlencoding.workspace = true

# Advanced Security Dependencies
ring.workspace = true
rand_chacha.workspace = true
getrandom.workspace = true
regex.workspace = true
zeroize.workspace = true
rand_core.workspace = true
base32.workspace = true

qrcode.workspace = true
argon2.workspace = true
bcrypt.workspace = true
scrypt.workspace = true
# jwt-simple.workspace = true  # Removed due to rsa dependency
x25519-dalek.workspace = true
axum.workspace = true
totp-rs.workspace = true
dashmap.workspace = true
tempfile.workspace = true
ed25519-dalek.workspace = true
p256.workspace = true
k256.workspace = true
aes.workspace = true
chacha20poly1305.workspace = true
toml.workspace = true
log.workspace = true
libloading.workspace = true
oauth2.workspace = true
# openidconnect = "3.5"  # Disabled temporarily due to RSA dependency
url.workspace = true
glob.workspace = true
tower-http.workspace = true
hyper.workspace = true
tracing-subscriber.workspace = true
wasmtime.workspace = true

# Certificate validation
x509-parser.workspace = true
pem.workspace = true

# HTTP API
warp.workspace = true

# Secret Versioning
secret_versioning = { path = "./secret_versioning" }
granular_revocation = { path = "./granular_revocation" }
audit_log = { path = "./audit_log" }
flate2.workspace = true

# Azure SDK Dependencies - Temporarily disabled for build
# azure_identity = "0.18"
# azure_security_keyvault = "0.18"
# azure_storage_blobs = "0.18"
# azure_storage_queues = "0.18"
# azure_core = "0.18"

# GCP SDK Dependencies - Temporarily disabled for build
# gcp-auth = "0.10"
# google-cloud-auth = "0.16"
# google-cloud-storage = "0.16"
# google-cloud-secretmanager = "0.16"
# google-cloud-bigquery = "0.16"
# google-cloud-iam = "0.16"
reqwest = { version = "0.11", features = ["json"] }

# LDAP Dependencies
ldap3.workspace = true

# RADIUS Dependencies
md5.workspace = true

# X.509 Certificate Dependencies
rustls-pemfile.workspace = true
rcgen.workspace = true
yasna.workspace = true

[features]
default = ["postgres", "redis"]
postgres = ["tokio-postgres", "deadpool-postgres"]
redis = []
wasm = []
distributed = []
test-utils = []
