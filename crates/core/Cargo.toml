[package]
name = "brankas-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core types and utilities for Brankas vault system"
keywords = ["core", "types", "utilities", "security"]

[dependencies]
# Core dependencies
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true

# Async
tokio.workspace = true
async-trait.workspace = true
futures = "0.3"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "migrate", "chrono", "json"] }

# Security dependencies for advanced features
rand = "0.8"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2.5"
base64 = "0.21"
hex = "0.4"
urlencoding = "2.1"

# Advanced Security Dependencies
ring = "0.17"
rand_chacha = "0.3"
regex = "1.0"
zeroize = "1.7"
rand_core = "0.6"
base32 = "0.5"
qrcode = "0.14"
argon2 = "0.5"
bcrypt = "0.15"
scrypt = "0.11"
jsonwebtoken = "9.2"
x25519-dalek = "2.0"
ed25519-dalek = "2.0"
rsa = "0.9"
p256 = "0.13"
k256 = "0.13"
aes = "0.8"
chacha20poly1305 = "0.10"

# HTTP API
warp = "0.3"

[features]
default = ["postgres", "redis"]
postgres = ["sqlx/postgres"]
redis = []
