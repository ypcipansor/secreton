[package]
name = "granular_revocation"
version = "0.1.0"
edition = "2021"
authors = ["Cipherce Security Team <security@cipherce.io>"]
description = "Granular Revocation for Secreton - Maximum Security, Zero Trust, Tamper-Evident"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
audit_log = { path = "../audit_log" }
uuid = { version = "1.8", features = ["v4"] }
