[package]
name = "secreton-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Secure storage backend for Secreton system"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
# Core dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true

# HTTP client for Consul/etcd
reqwest.workspace = true
base64.workspace = true
urlencoding.workspace = true

# Database - Using postgres crate for better dependency isolation
postgres.workspace = true
postgres-types.workspace = true

# MongoDB client
mongodb.workspace = true

# Database
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
redis.workspace = true
# SQLx temporarily disabled due to RSA vulnerability in MySQL backend
# sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
mysql.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-s3.workspace = true
aws-config.workspace = true
aws-smithy-types.workspace = true
aws-types.workspace = true

# Azure Storage - removed to avoid failure dependency
# azure_storage.workspace = true
# azure_storage_blobs.workspace = true
# azure_core.workspace = true

# Async streams
futures.workspace = true
tokio-stream.workspace = true
regex.workspace = true

# Cryptography
secreton-crypto = { path = "../crypto" }
zeroize.workspace = true

# Random number generation
rand.workspace = true
hex.workspace = true

# Common utilities
secreton-common.workspace = true

# Configuration
toml.workspace = true

# Utilities
bincode.workspace = true
ciborium.workspace = true

# GCP (pure Rust)
# google-cloud-storage.workspace = true

# Kubernetes (optional)
kube = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[features]
default = []
kubernetes = ["kube", "k8s-openapi"]
