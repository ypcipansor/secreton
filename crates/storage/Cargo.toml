[package]
name = "secreton-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Secure storage backend for Secreton vault system"
keywords = ["storage", "database", "vault", "security"]

[dependencies]
# Core dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true

# Database - Using postgres crate for better dependency isolation
postgres = { version = "0.19", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
postgres-types = { version = "0.2", features = ["derive"] }

# Database
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
redis.workspace = true

# Cryptography
secreton-crypto = { path = "../crypto" }
zeroize.workspace = true
secrecy.workspace = true

# Configuration
toml.workspace = true

# Utilities
bincode.workspace = true
ciborium = "0.2"

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
