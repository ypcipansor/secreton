[package]
name = "secreton-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Secure storage backend for Secreton vault system"
keywords = ["storage", "database", "vault", "security"]

[dependencies]
# Core dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true

# HTTP client for Consul/etcd
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
base64 = "0.21"

# Database - Using postgres crate for better dependency isolation
postgres = { version = "0.19", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
postgres-types = { version = "0.2", features = ["derive"] }

# Database
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
redis.workspace = true
# SQLx temporarily disabled due to RSA vulnerability in MySQL backend
# sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
mysql = { version = "26.0.1", features = ["chrono"] }
aws-sdk-dynamodb = "1.0"
aws-sdk-s3 = "1.0"
aws-config = "1.0"
aws-smithy-types = "1.0"
aws-types = "1.0"

# Azure Storage
azure_storage = "0.20"
azure_storage_blobs = "0.20"
azure_core = "0.20"

# Cryptography
secreton-crypto = { path = "../crypto" }
zeroize.workspace = true
secrecy.workspace = true

# Configuration
toml.workspace = true

# Utilities
bincode.workspace = true
ciborium = "0.2"

# Google Cloud Storage Dependencies
google-cloud-storage = "0.16"
futures = "0.3"

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
