[package]
name = "secreton-storage"
description = "Storage abstraction and backends (memory, file, PostgreSQL, Redis, Raft) for Secreton"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
secreton-crypto.workspace = true
secreton-domain.workspace = true

async-trait.workspace = true
bincode.workspace = true
parking_lot.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time", "macros", "rt"] }
tokio-stream.workspace = true
tracing.workspace = true
uuid.workspace = true

base64.workspace = true
hex.workspace = true
rand.workspace = true
zeroize.workspace = true

# Backends. Everything reachable from the default feature set is a backend that is
# actually implemented and covered by tests; the 19 sketched backends that used to
# live here (DynamoDB, Spanner, FoundationDB, ZooKeeper, …) were removed rather than
# left as a promise, along with their transitive `rsa` and cloud-SDK dependencies.
deadpool-postgres = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
toml.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }

[features]
# `memory` and `file` need no external service, so they are always available and
# make the crate usable in tests and in `cargo leptos serve` with no dependencies.
default = ["postgres", "redis", "raft"]
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres"]
redis = ["dep:redis"]
# Experimental: single-node only, no cluster membership changes yet.
raft = []
