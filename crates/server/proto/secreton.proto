syntax = "proto3";

package secreton.v1;

// Read and write secrets.
//
// Every RPC requires an `authorization: Bearer <token>` metadata entry; the interceptor
// resolves it to the same principal the REST API would.
service SecretService {
  rpc GetSecret (GetSecretRequest) returns (GetSecretResponse);
  rpc PutSecret (PutSecretRequest) returns (PutSecretResponse);
  rpc DeleteSecret (DeleteSecretRequest) returns (DeleteSecretResponse);
}

// Obtain a token for service-to-service calls.
service AuthService {
  rpc Login (LoginRequest) returns (LoginResponse);
}

message GetSecretRequest {
  string path = 1;
}

message GetSecretResponse {
  map<string, string> data = 1;
  uint64 version = 2;
}

message PutSecretRequest {
  string path = 1;
  map<string, string> data = 2;
}

message PutSecretResponse {
  string path = 1;
  uint64 version = 2;
}

message DeleteSecretRequest {
  string path = 1;
}

message DeleteSecretResponse {
  bool deleted = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  // Optional second factor, when the account has MFA enrolled.
  optional string mfa_code = 3;
}

message LoginResponse {
  string access_token = 1;
  // Seconds until `access_token` expires.
  uint64 expires_in = 2;
}
