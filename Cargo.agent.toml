[package]
name = "vault_adhyaksa_agent"
version = "0.1.0"
edition = "2021"
authors = ["Adhyaksa Team"]
description = "Vault Adhyaksa Agent: auto-auth, template rendering, token renewal, sink, dsb."

[dependencies]
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.28", features = ["full"] }
tera = "1.19"
clap = { version = "4.3", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10" 
notify = "6.1" 
axum = "0.6" 
flexi_logger = "0.27" 