# Brankas Vault - Raft Integrated Storage Configuration
# Compatible with HashiCorp Vault integrated storage approach

[server]
host = "127.0.0.1"
port = 8200
tls_enabled = false

[storage]
# Use "raft" for integrated storage with high availability
backend_type = "raft"

# Node configuration
node_id = "brankas-node-1"
data_dir = "./data/raft"

# Cluster communication
bind_addr = "127.0.0.1:8201"
advertise_addr = "127.0.0.1:8201"

# Initial cluster peers (empty for single node)
# For multi-node: peers = ["node2:8201", "node3:8201"]
peers = []

# Raft performance tuning
snapshot_enabled = true
snapshot_interval_secs = 120
log_retention_count = 10000
performance_multiplier = 1

[security]
# Vault seal configuration
seal_type = "auto"  # auto, shamir, transit, gcpkms, awskms, azurekeyvault

# Authentication
default_auth_method = "token"
auth_methods = ["token", "userpass", "ldap"]

# TLS/mTLS
tls_cert_file = ""
tls_key_file = ""
tls_ca_file = ""
tls_verify_incoming = false

[logging]
level = "info"
format = "json"
audit_enabled = true
audit_file = "./logs/audit.log"

[crypto]
# Default encryption key for data at rest
seal_key = ""

# Transit engine configuration
default_key_type = "aes256-gcm"
key_rotation_interval = "30d"
