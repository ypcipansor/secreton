# Server configuration
[server]
host = "127.0.0.1"
port = 8080
log_level = "info"
storage_path = "./data"

# Database configuration - Optimized for PostgreSQL
[database]
# PostgreSQL connection URL (recommended for production)
url = "postgresql://secreton_user:secure_password@localhost:5432/secreton_db"
# Optimized connection pool settings for PostgreSQL
max_connections = 20
min_connections = 5
max_lifetime = 1800  # 30 minutes
idle_timeout = 300   # 5 minutes
connection_timeout = 10
# PostgreSQL-specific optimizations
statement_cache_size = 1000
prepared_statement_cache_size = 100

# Authentication configuration
[auth]
token_ttl = 3600  # 1 hour in seconds
refresh_token_ttl = 2592000  # 30 days in seconds
jwt_secret = "change-this-to-a-secure-random-string"

# OAuth configuration
[oauth]
base_url = "https://api.secreton.com"

[oauth.google]
client_id = "your-google-client-id"
client_secret = "your-google-client-secret"
redirect_uri = "https://api.secreton.com/auth/oauth/google/callback"

[oauth.github]
client_id = "your-github-client-id"
client_secret = "your-github-client-secret"
redirect_uri = "https://api.secreton.com/auth/oauth/github/callback"

[oauth.microsoft]
client_id = "your-microsoft-client-id"
client_secret = "your-microsoft-client-secret"
redirect_uri = "https://api.secreton.com/auth/oauth/microsoft/callback"

[oauth.okta]
tenant = "your-tenant"
client_id = "your-okta-client-id"
client_secret = "your-okta-client-secret"
redirect_uri = "https://api.secreton.com/auth/oauth/okta/callback"
