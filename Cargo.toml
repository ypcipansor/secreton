[package]
name = "vault-adhyaksa"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.6"
tokio = { version = "1.36", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
argon2 = "0.5"
jsonwebtoken = "9.2"
tracing = "0.1"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
config = "0.13"
toml = "0.8"
futures = "0.3"
hex = "0.4"
dashmap = "5.5"
prometheus = "0.13"
axum-prometheus = "0.4"
utoipa = { version = "4.2", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "5.0", features = ["axum"] }
aws-config = "1.1"
aws-sdk-iam = "1.14"
ldap3 = "0.11"
openidconnect = "3.4"
glob = "0.3"
once_cell = "1.19"
async-trait = "0.1"
tokio-postgres = "0.7"
libloading = "0.8"
base64 = "0.21"
metrics-exporter-prometheus = "0.13"
bc-shamir = "0.8"
openraft = { version = "0.8", features = ["serde"] }
wasmtime = "14.0"
rand = "0.8"
