[workspace]
resolver = "2"
members = [
    "crates/core",
    # "crates/agent", # Temporarily disabled - has module issues
    "crates/ui",
    "crates/crypto",
    "crates/storage",
    "crates/api",
    "crates/cli"
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Cipherce Security Team <security@cipherce.io>"]
license = "Apache-2.0"
repository = "https://github.com/cipherce/secreton-vault"
homepage = "https://cipherce.io/secreton"
description = "Advanced Security Vault System with Quantum-Safe Cryptography by Cipherce"
keywords = ["security", "vault", "cryptography", "zero-trust", "quantum-safe"]
categories = ["cryptography", "authentication", "security-tools"]
rust-version = "1.70"

[workspace.dependencies]
# Core crate dependencies
secreton-core = { path = "crates/core" }
secreton-crypto = { path = "crates/crypto" }
secreton-storage = { path = "crates/storage" }
secreton-api = { path = "crates/api" }
# Core dependencies
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bincode = "1.3"
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# Testing dependencies
criterion = { version = "0.5", features = ["html_reports"] }
proptest = { version = "1.2", default-features = false, features = ["std"] }
rmp-serde = "1.1"
secrecy = { version = "0.8", features = ["serde"] }
wiremock = { version = "0.6.5", default-features = false }

# Async runtime
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"

# Cryptography
ring = "0.17"
rustls = "0.22"
rustls-webpki = "0.102"
aes-gcm = "0.10"
aes = "0.8"
chacha20poly1305 = "0.10"
argon2 = "0.5"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1.5"
hmac = "0.12"
pbkdf2 = "0.12"
hkdf = "0.12"
scrypt = "0.11"
hex = "0.4"
base32 = "0.4"
base64 = "0.21"
rand = "0.8"

# RustCrypto elliptic curves
p256 = "0.13"
p384 = "0.13"
k256 = "0.13"
x25519-dalek = "2.0"
ed25519-dalek = "2.1"

# Cryptographic traits and utilities
digest = "0.10"
signature = "2.2"
elliptic-curve = "0.13"
generic-array = "0.14"
subtle = "2.6"
rand_core = { version = "0.6", features = ["getrandom"] }

# Post-quantum cryptography (experimental/deprecated - not ready for production)
# kyber = "0.1"
# dilithium = "0.2.0-alpha.3"  
# falcon = "0.5"
# sphincs-plus = "0.2"

# Network and HTTP
axum = { version = "0.7", features = ["macros", "multipart", "json", "tracing"] }
hyper = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tonic = { version = "0.10", features = ["tls"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "compression"] }
prost = "0.12"

# Database - Using postgres crate for better dependency isolation and security
# Replaced sqlx with postgres crate to avoid RSA vulnerabilities from sqlx-mysql
postgres = { version = "0.19", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
postgres-types = { version = "0.2", features = ["derive"] }

# Database dependencies - Updated to latest versions
tokio-postgres = { version = "0.7.10", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"
redis = { version = "0.26", features = ["tokio-comp", "connection-manager"] }

# Configuration
toml = "0.8"
config = "0.14"
clap = { version = "4.4", features = ["derive"] }

# Metrics and monitoring
# Metrics and monitoring
prometheus = "0.14.0"  # Updated to address protobuf vulnerability
opentelemetry = "0.21"
opentelemetry-jaeger = "0.20"

# Security utilities
constant_time_eq = "0.3"

# Serialization formats
cbor4ii = "=0.3.3"  # Pinned to resolve version conflict
num_cpus = "1.16"

# Development and testing dependencies
tokio-test = "0.4"
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true

[profile.dev]
opt-level = 0
debug = true
incremental = true

# Security-focused profile for maximum performance
[profile.security]
inherits = "release" 
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
