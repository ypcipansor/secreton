[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/errors",
    "crates/config",
    "crates/performance",
    "crates/core",
    # "crates/token",  # Merged into auth crate
    "crates/monitoring",
    "crates/agent",
    "crates/ui",
    "crates/crypto",
    "crates/storage",
    "crates/replication",
    "crates/api",
    "crates/cli",
    "crates/security",
    "crates/integrations",
    "crates/infrastructure",
    "crates/enterprise",
    "crates/secrets-pki",
    "crates/secrets-database",
    "crates/secrets",
    "crates/auth",
    # "crates/policies",  # Merged into auth crate
    # "crates/graphql",  # Temporarily disabled
    # "crates/grpc",  # Temporarily disabled
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Irhas <zynqrs@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/analisaperlengkapan/secreton"
homepage = "https://github.com/analisaperlengkapan/secreton"
description = "Advanced Security System with Quantum-Safe Cryptography"
keywords = ["security", "vault", "cryptography", "zero-trust", "quantum-safe"]
categories = ["cryptography", "authentication", "security-tools"]
rust-version = "1.90"

[workspace.dependencies]
# Core crate dependencies
secreton-common = { path = "crates/common" }
secreton-errors = { path = "crates/errors" }
secreton-config = { path = "crates/config" }
secreton-performance = { path = "crates/performance" }
secreton-core = { path = "crates/core" }
# secreton-token = { path = "crates/token" }  # Merged into auth crate
secreton-monitoring = { path = "crates/monitoring" }
secreton-crypto = { path = "crates/crypto" }
secreton-storage = { path = "crates/storage" }
secreton-replication = { path = "crates/replication" }
secreton-api = { path = "crates/api" }
secreton-graphql = { path = "crates/graphql" }
secreton-grpc = { path = "crates/grpc" }
secreton-security = { path = "crates/security" }
secreton-integrations = { path = "crates/integrations" }
secreton-infrastructure = { path = "crates/infrastructure" }
secreton-enterprise = { path = "crates/enterprise" }
secreton-secrets-pki = { path = "crates/secrets-pki" }
secreton-secrets-database = { path = "crates/secrets-database" }
secreton-secrets = { path = "crates/secrets" }
secreton-auth = { path = "crates/auth" }
# secreton-policies = { path = "crates/policies" }  # Merged into auth crate
audit-log = { path = "crates/security", package = "secreton-security" }
# granular-revocation now part of auth crate
# secret-versioning now part of enterprise crate
# token crate merged into auth crate
# Core dependencies
tokio = { version = "1.47.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
anyhow = "1.0.100"
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.11.1", features = ["v4", "serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
bincode = "1.3.3"
zeroize = { version = "1.8.1", features = ["zeroize_derive", "aarch64"] }
redis = { version = "0.32.7", features = ["tokio-comp", "connection-manager"] }

# System monitoring dependencies
sysinfo = "0.30"
nix = "0.27"

# Testing dependencies
criterion = { version = "0.7", features = ["html_reports"] }
rmp-serde = "1.1"
wiremock = { version = "0.6.5", default-features = false }
proptest = { version = "1.5", default-features = false, features = ["std"] }

# Async runtime
async-trait = "0.1.89"
futures = "0.3.31"
futures-util = "0.3.31"
tokio-stream = "0.1"

# Cryptography - Pure Rust, Audited by Security Experts
# Using RustCrypto suite - audited, memory-safe, zero C dependencies
ring = "0.17.14"  # Audited cryptography library (latest stable)
rustls = "0.23.32"   # Pure Rust TLS 1.2/1.3 (audited, no OpenSSL)
rustls-webpki = "0.103.7"  # Pure Rust X.509 certificate validation
rustls-pemfile = "2.2.0"  # PEM file handling
webpki-roots = "1.0.2"  # Mozilla CA certificates bundle

# RustCrypto Symmetric Encryption (audited)
aes-gcm = "0.10.3"  # AES-GCM AEAD
aes = "0.8.4"  # AES block cipher
ctr = "0.9.2"  # CTR mode
cbc = "0.1.2"  # CBC mode
chacha20poly1305 = "0.10.1"  # ChaCha20-Poly1305 AEAD

# RustCrypto Password Hashing (audited)
argon2 = "0.5.3"  # Argon2 (winner of Password Hashing Competition)
pbkdf2 = "0.12.2"  # PBKDF2
scrypt = "0.11.0"  # scrypt
bcrypt = "0.17.1"  # bcrypt
password-hash = "0.5"

# RustCrypto Hashing (audited)
sha2 = "0.10.9"  # SHA-2 family
sha3 = "0.10.8"  # SHA-3 family
blake3 = "1.8.2"  # BLAKE3 (fastest secure hash)
blake2 = "0.10.6"  # BLAKE2
hmac = "0.12.1"  # HMAC
hkdf = "0.12.4"  # HKDF key derivation

# Encoding (pure Rust)
hex = "0.4.3"
base32 = "0.4.0"
base64 = "0.22.1"
data-encoding = "2.6.0"

serde_bytes = "0.11.5"
rand = "0.8.5"  # Cryptographically secure RNG
rand_core = { version = "0.6.4", features = ["getrandom"] }
rand_chacha = "0.3.1"  # ChaCha RNG
getrandom = "0.3.3"  # OS randomness

# Regex (pure Rust)
regex = "1.12.1"

# Configuration
config = { version = "0.14", default-features = false, features = ["toml", "json", "yaml"] }
toml = "0.8"
time = "0.3"

# Database
mongodb = "3.0"

# Threshold cryptography
threshold-secret-sharing = "0.1.1"

# Parser (pure Rust)
pest = "2.7"
pest_derive = "2.7"

# RustCrypto Elliptic Curves (audited, pure Rust, NO RSA)
# Ed25519/X25519 - fastest, most secure, audited by multiple teams
ed25519-dalek = "2.1.1"  # Ed25519 signatures (primary algorithm)
x25519-dalek = "2.0.1"  # X25519 key exchange
curve25519-dalek = "4.1.3"  # Curve25519 operations

# NIST curves (when interoperability required)
p256 = "0.13.2"  # NIST P-256 (secp256r1)
p384 = "0.13.0"  # NIST P-384 (secp384r1)
k256 = "0.13.4"  # secp256k1 (Bitcoin/Ethereum)

# X.509 and Certificate handling (pure Rust)
x509-parser = "0.18.0"  # X.509 certificate parsing
x509-cert = "0.2.5"  # X.509 certificate handling (RustCrypto)
pem = "3.0.4"  # PEM encoding
rcgen = "0.14.5"  # Certificate generation (pure Rust)
der = "0.7.9"  # DER encoding (RustCrypto)
yasna = "0.5.2"  # ASN.1 encoding

# Cryptographic traits (RustCrypto)
digest = "0.10.7"  # Digest trait
signature = "2.2.0"  # Signature trait
elliptic-curve = "0.13.8"  # EC traits
generic-array = "1.3.3"  # Generic arrays
subtle = "2.6.1"  # Constant-time operations

# Post-quantum cryptography (experimental/deprecated - not ready for production)
# kyber = "0.1"
# dilithium = "0.2.0-alpha.3"  
# falcon = "0.5"
# sphincs-plus = "0.2"

# Network and HTTP
axum = { version = "0.7", features = ["macros", "multipart", "json", "tracing"] }
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
hyper = { version = "1.7.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
web-sys = { version = "0.3.70", features = ["console", "Storage", "Window", "Location"] }
wasm-bindgen-futures = "0.4"
rust-embed = "8.0"
mime_guess = "2.0"
rpassword = "7.3"
tonic = { version = "0.10", features = ["tls"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "compression-full"] }
prost = "0.12"

# AWS SDK
aws-config = "1.8.8"
aws-sdk-iam = "1.91.0"
aws-sdk-sts = "1.91.0"
aws-sdk-ec2 = "1.95.0"
aws-sdk-secretsmanager = "1.91.0"

# Authentication protocols
jsonwebtoken = "9.3"
oauth2 = { version = "5.0", features = ["reqwest"] }
openidconnect = "3.5"
saml = "0.4"

# LDAP
ldap3 = { version = "0.12.1" }

# RADIUS
radius-rust = "0.4.4"

# XML parsing for SAML
xml = "0.8"

# Kubernetes client
kube = { version = "0.95", features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.23", features = ["v1_30"] }

# Threading and concurrency
parking_lot = "0.12"

# Database - Pure Rust stack with rustls (NO OpenSSL)
tokio-postgres = { version = "0.7.12", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
postgres-types = { version = "0.2.11", features = ["derive"] }
postgres = { version = "0.19.9", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14.0"
# Using rustls instead of native-tls (pure Rust, no OpenSSL)
tokio-postgres-rustls = "0.13.0"  # Pure Rust TLS for PostgreSQL
# SQLx with PostgreSQL-only (removing RSA vulnerability from MySQL) - temporarily disabled
# sqlx = { version = "0.8.2", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }

# GraphQL
async-graphql = { version = "7.0", features = ["chrono", "uuid", "tracing"] }
async-graphql-axum = "7.0"

# CLI
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
dirs = "5.0"
comfy-table = "7.1"

# Metrics and monitoring
prometheus = "0.14.0"  # Updated to address protobuf vulnerability
opentelemetry = "0.21"
opentelemetry-jaeger = "0.20"
tracing-opentelemetry = "0.22"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
axum-tracing-opentelemetry = "0.32"

# Security monitoring and alerting
sentry = "0.32"
sentry-tracing = "0.32"

# Runtime security validation
# bollard = "0.16"  # Docker API for container security - temporarily disabled
# kube = { version = "0.87", features = ["client", "derive"] }  # Kubernetes integration - temporarily disabled

# Health checks and monitoring
axum-health = "0.1"

# Configuration security
secrecy = { version = "0.10", features = ["serde"] }

# Serialization formats
cbor4ii = "1.1.1"  # Pinned to resolve version conflict
num_cpus = "1.16"

# Additional commonly used dependencies (pure Rust, audited)
once_cell = "1.20.2"  # Thread-safe lazy initialization
dashmap = "6.1.0"  # Concurrent hashmap (lock-free)
tempfile = "3.14.0"  # Temporary files (secure)
url = "2.5.4"  # URL parsing (audited)
glob = "0.3.1"  # File pattern matching
log = "0.4.22"  # Logging facade
sha1 = "0.10.6"  # SHA1 (legacy only, use SHA2/SHA3 for new code)
md5 = "0.7.0"  # MD5 (legacy only, BROKEN, use SHA2/SHA3)
urlencoding = "2.1.3"  # URL encoding
libloading = "0.9.0"  # Dynamic library loading
flate2 = "1.0.35"  # Compression (pure Rust miniz_oxide backend)

# API and HTTP
http-body-util = "0.1"
lazy_static = "1.4"
lru = "0.12"
governor = "0.6"
headers = "0.4"
utoipa = { version = "5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8.0", features = ["axum"] }
mockito = "1.4"
bollard = "0.16"
axum-server = { version = "0.7.1", features = ["tls-rustls"] }
tokio-rustls = "0.26"
tonic-build = "0.10"

# Authentication and crypto utilities (audited)
# jwt-simple = "0.12"  # JWT (pure Rust, no RSA dependency) - removed due to rsa dependency
totp-rs = { version = "5.6.0", default-features = false, features = ["otpauth", "qr"] }  # TOTP
qrcode = "0.14.1"  # QR code generation

# LDAP (with rustls for TLS)
# ldap3 = { version = "0.12.1" }  # Already defined above

# Database
mysql_async = { version = "0.36", default-features = false, features = ["default-rustls"] }

# WebAssembly (pure Rust, audited)
# wasmtime = "35.0.0"  # Removed to avoid old ring
wasmi = "0.51.1"  # Alternative WASM interpreter (lighter)

# HTTP frameworks
warp = "0.4"  # Alternative HTTP framework

# PQC (Post-Quantum Cryptography) - NIST standardized algorithms
# Pure Rust implementations, actively maintained
# pqcrypto-traits = "0.3.5"
# pqcrypto-mldsa = "0.1.2"  # ML-DSA (NIST FIPS 204)
# pqcrypto-mlkem = "0.1.1"  # ML-KEM (NIST FIPS 203)
# pqcrypto-falcon = "0.4.1"  # Falcon signatures

# Numeric utilities (pure Rust)
num-bigint = { version = "0.4.6", features = ["rand"] }  # Big integers
num-traits = "0.2.19"  # Numeric traits
num-integer = "0.1.46"  # Integer utilities

# Serialization
ciborium = "0.2"  # CBOR

# Cloud provider SDKs (pure Rust with rustls)
aws-sdk-dynamodb = "1.95.0"
aws-sdk-s3 = "1.108.0"
aws-smithy-types = "1.2.7"
aws-types = "1.3.3"
aws-smithy-runtime = "1.7.2"
# GCP (pure Rust)
# google-cloud-storage = "1.1.0"

# Database drivers
mysql = { version = "26.0", features = ["chrono"] }  # MySQL sync

# Additional security utilities
const-oid = "0.10.1"  # Const OID (RustCrypto)
spki = "0.7.3"  # SubjectPublicKeyInfo (RustCrypto)
pkcs8 = "0.10.2"  # PKCS#8 (RustCrypto)
sec1 = "0.7.3"  # SEC1 EC keys (RustCrypto)

# Development and testing dependencies
tokio-test = "0.4.4"
pretty_assertions = "1.4.1"
criterion-cycles-per-byte = "0.7.0"  # Benchmarking constant-time operations

# Performance optimization profiles
[profile.dev]
# Faster compile times for development
opt-level = 1                # Light optimization for better dev experience
debug = true                 # Keep debug info for development
incremental = true           # Enable incremental compilation
codegen-units = 256          # Parallel compilation for faster builds
lto = false                  # Disable LTO in dev for faster incremental builds
split-debuginfo = "unpacked" # Faster debug builds on Linux/macOS

[profile.release]
# Maximum optimization for production
opt-level = 3                # Maximum optimization level
lto = "fat"                  # Full LTO for maximum optimization
codegen-units = 1            # Single codegen unit for best optimization
panic = "abort"              # Smaller binary, faster panics
strip = true                 # Strip symbols for smaller binary
overflow-checks = true       # Keep overflow checks for security
debug = false                # No debug info in release
incremental = false          # Disable incremental for clean release builds

[profile.bench]
inherits = "release"
debug = true

# Optimize dependencies in dev mode for faster runtime
[profile.dev.package."*"]
opt-level = 2           # Optimize dependencies while keeping fast compile times

# Optimize specific heavy dependencies
[profile.dev.package.tokio]
opt-level = 3           # Tokio benefits from optimization

[profile.dev.package.ring]
opt-level = 3           # Crypto benefits from optimization

# Security-hardened profile for production deployment
[profile.security]
inherits = "release" 
opt-level = 3
lto = "fat"  # Maximum LTO
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true  # Runtime integer overflow detection
debug-assertions = false
incremental = false

# Hardening flags via RUSTFLAGS (set in CI/CD):
# -C control-flow-guard=checks  # CFG on Windows
# -C relocation-model=pic  # Position independent code
# -Z sanitizer=address  # AddressSanitizer (nightly)
# -Z sanitizer=memory  # MemorySanitizer (nightly)
