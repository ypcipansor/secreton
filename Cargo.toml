[package]
name = "brankas-adhyaksa"
version = "0.3.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Secure secret management system"
repository = "https://github.com/yourusername/brankas-adhyaksa"
license = "MIT OR Apache-2.0"
readme = "README.md"

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1.36", features = ["full", "rt-multi-thread", "time", "fs"] }
tower = { version = "0.5", features = ["util", "timeout", "load-shed", "limit"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full", "fs"] }
hyper = { version = "1.0", features = ["server", "http1", "http2"] }

# Async
async-trait = "0.1"
futures = "0.3"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "migrate", "chrono", "json"] }

# Security / Cryptography
aes-gcm = { version = "0.10", features = ["aes"] }
argon2 = { version = "0.5", features = ["std"] }
bcrypt = "0.15"
hmac = { version = "0.12", features = ["std"] }
pbkdf2 = "0.12"
rand = { version = "0.8", features = ["std"] }
ring = "0.17"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
sha-1 = { version = "0.10", features = ["std"] }
base32 = "0.4"
base64 = "0.21"
totp-rs = { version = "5.7.0", features = ["otpauth"] }
hex = "0.4"

# JWT and Authentication
jsonwebtoken = "9.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.0"
toml = "0.8"

# Configuration
config = { version = "0.13", features = ["yaml"] }
dotenv = "0.15"

# Utilities & Logging
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.4", features = ["v4", "serde"] }
once_cell = "1.19"
lazy_static = "1.4"
dashmap = { version = "5.5", features = ["raw-api"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Monitoring and Metrics
prometheus = "0.13"
axum-prometheus = "0.5"
utoipa = { version = "5.4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# Clustering / Shamir / Raft
bc-shamir = "0.8"
openraft = { version = "0.8", features = ["serde"] }

# WASM (optional/extensions)
wasmtime = "14.0"

# Cloud Integration (optional)
aws-config = { version = "1.1", optional = true }
aws-sdk-iam = { version = "1.14", optional = true }

# Authentication (optional)
ldap3 = { version = "0.11", optional = true }
openidconnect = { version = "3.4", optional = true }

glob = "0.3"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.5"
tempfile = "3.3"
mockall = { version = "0.11", features = [] }
mockall_derive = "0.11"
url = { version = "2.4", features = ["serde"] }
assert_matches = "1.5"

[build-dependencies]
vergen = { version = "8.0", features = ["build", "git"] }
