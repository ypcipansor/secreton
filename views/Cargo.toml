[package]
name = "vault_adhyaksa_ui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "0.6"
leptos_router = "0.6"
reqwest = { version = "0.11", features = ["json", "wasm-client"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
log = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage"] } 