# Secreton Single Configuration File
# This file is applied to the database and can be deleted afterwards for security.

[http]
bind_address = "0.0.0.0:8080"
timeout = 30
max_body_size = 16777216 # 16MB
keep_alive = 75
compression = true

[grpc]
enabled = false
bind_address = "127.0.0.1:9090"
timeout = 30
max_message_size = 4194304
reflection = false
health_check = true

[auth.jwt]
secret = "change-this-secret-in-production-1234567890"
expiration = 3600
refresh_expiration = 604800 # 7 days
algorithm = "HS256"
issuer = "secreton"
audience = "secreton-api"

[auth.session]
timeout = 3600
store = { type = "Memory" }

[auth.session.cookie]
name = "secreton-session"
path = "/"
secure = false # Set to true in production with HTTPS
http_only = true
same_site = "Strict"

[auth.mfa]
enabled = false
[auth.mfa.totp]
issuer = "Secreton"
secret_length = 32
time_step = 30
code_length = 6
skew_tolerance = 1

[rate_limit]
enabled = true

[rate_limit.global]
requests = 1000
window = 60
burst = 100

[rate_limit.per_user]
requests = 100
window = 60
burst = 10

[monitoring]
metrics = true
metrics_path = "/admin/metrics"
health_path = "/health"
tracing = false

[cors]
enabled = true
allowed_origins = ["*"]
allowed_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allowed_headers = ["Authorization", "Content-Type", "X-Admin-Token"]
exposed_headers = []
allow_credentials = true

[logging]
level = "info"
format = "pretty"
json = false

[storage]
backend_type = "file"

[storage.file_config]
base_path = "./secreton-data"
