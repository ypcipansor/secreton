# Secreton Configuration File
# This file is used to bootstrap or update the configuration of the Secreton server.
# After applying this configuration using `secreton-cli config apply --file secreton.toml`,
# the configuration is stored securely in the configured storage backend.
# You can delete this file after application to maintain zero-trust security.

# ==============================================================================
# HTTP Server Configuration
# ==============================================================================
[http]
# The address and port the API server will listen on.
# 0.0.0.0 allows connections from any network interface.
bind_address = "0.0.0.0:8080"

# Request timeout in seconds.
timeout = 30

# Maximum request body size in bytes (default: 16MB).
max_body_size = 16777216

# TCP Keep-Alive duration in seconds.
keep_alive = 75

# Enable GZIP compression for responses.
compression = true

# ==============================================================================
# gRPC Server Configuration (Disabled by default)
# ==============================================================================
[grpc]
enabled = false
bind_address = "127.0.0.1:9090"
timeout = 30
max_message_size = 4194304
reflection = false
health_check = true

# ==============================================================================
# Authentication & JWT Configuration
# ==============================================================================
[auth.jwt]
# JWT Signing Secret
# NOTE: The secret is NOT included here for security.
# Secreton will automatically generate a secure random secret on first startup
# and persist it in the storage backend. This ensures the secret is never
# exposed in configuration files or version control.
# secret = "auto-generated-by-secreton"

# Access token expiration in seconds (default: 1 hour).
expiration = 3600

# Refresh token expiration in seconds (default: 7 days).
refresh_expiration = 604800

# JWT Algorithm (default: HS256).
algorithm = "HS256"

# JWT Issuer claim.
issuer = "secreton"

# JWT Audience claim.
audience = "secreton-api"

# ==============================================================================
# Session Management
# ==============================================================================
[auth.session]
# Session timeout in seconds.
timeout = 3600

# Session storage mechanism.
# "Memory" is suitable for single-instance deployments.
# For clusters, use "Redis" or "Database".
store = { type = "Memory" }

[auth.session.cookie]
name = "secreton-session"
path = "/"
secure = false # Set to true in production with HTTPS
http_only = true
same_site = "Strict"

# ==============================================================================
# Multi-Factor Authentication (MFA)
# ==============================================================================
[auth.mfa]
enabled = false

[auth.mfa.totp]
issuer = "Secreton"
secret_length = 32
time_step = 30
code_length = 6
skew_tolerance = 1

# ==============================================================================
# Rate Limiting
# ==============================================================================
[rate_limit]
enabled = true

[rate_limit.global]
requests = 1000
window = 60 # seconds
burst = 100

[rate_limit.per_user]
requests = 100
window = 60 # seconds
burst = 10

# ==============================================================================
# Monitoring & Metrics
# ==============================================================================
[monitoring]
metrics = true
metrics_path = "/admin/metrics"
health_path = "/health"
tracing = false

# ==============================================================================
# Cross-Origin Resource Sharing (CORS)
# ==============================================================================
[cors]
enabled = true
# Allow all origins for development. Restrict this in production.
allowed_origins = ["*"]
allowed_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allowed_headers = ["Authorization", "Content-Type", "X-Admin-Token"]
exposed_headers = []
allow_credentials = true

# ==============================================================================
# Logging
# ==============================================================================
[logging]
level = "info"
format = "pretty"
json = false

# ==============================================================================
# Storage Backend
# ==============================================================================
[storage]
# The storage backend to use. Options: "file", "postgres", "mysql", "redis", etc.
backend_type = "file"

[storage.file_config]
# Path to the directory where data will be stored (for file backend).
base_path = "./secreton-data"
